[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-evidence-miner"
version = "0.1.0"
description = "Autonomous Evidence Mining Agent for Delphi Prediction Markets"
authors = [{ name = "Rajnish Singh", email = "rajnisihsingh@gmail.com" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
